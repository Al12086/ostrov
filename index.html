<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Остров</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#49bfe6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Остров">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #49bfe6; }
  body {
    font-family: ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    color: #4a3560; user-select: none; -webkit-user-select: none; touch-action: none;
    overscroll-behavior: none;
  }
  canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }
  .hidden { display: none !important; }

  /* ---------- вход ---------- */
  #lobby {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: 12px; background: rgba(60, 150, 200, .28); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    overflow: auto; touch-action: pan-y;
  }
  .card {
    width: min(560px, 100%); background: rgba(255, 252, 248, .96); border-radius: 32px;
    padding: 22px 22px 20px; box-shadow: 0 18px 50px rgba(40, 60, 110, .35), inset 0 0 0 3px #fff;
    text-align: center; margin: auto;
  }
  .card h1 { margin: 0; font-size: 44px; line-height: 1; font-weight: 900; color: #ff5fa2; letter-spacing: 1px;
    text-shadow: 0 3px 0 #ffd3e6; }
  .card .sub { margin: 6px 0 16px; font-size: 16px; font-weight: 700; color: #8a78a8; }
  .lbl { font-size: 14px; font-weight: 800; color: #8a78a8; margin: 12px 0 6px; text-transform: uppercase; letter-spacing: .6px; }
  input.txt {
    width: 100%; font: inherit; font-size: 24px; font-weight: 800; text-align: center; color: #4a3560;
    padding: 12px 14px; border-radius: 18px; border: 3px solid #e7dcf5; background: #fff; outline: none;
    user-select: text; -webkit-user-select: text;
  }
  input.txt:focus { border-color: #ff9cc7; }
  #looks { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  #looks button {
    width: 76px; height: 92px; padding: 0; border-radius: 18px; background: #f4eefb; border: 3px solid transparent;
    transition: transform .12s;
  }
  #looks button.on { border-color: #ff7eb6; background: #ffe9f3; transform: scale(1.07); }
  #looks canvas { width: 70px; height: 86px; display: block; }
  .big {
    display: block; width: 100%; margin-top: 14px; padding: 16px 18px; border-radius: 22px;
    font-size: 24px; font-weight: 900; color: #fff; background: linear-gradient(#ff8ec0, #ff5fa2);
    box-shadow: 0 6px 0 #d9417f, 0 12px 22px rgba(255, 95, 162, .35);
  }
  .big:active { transform: translateY(4px); box-shadow: 0 2px 0 #d9417f; }
  .big.alt { background: linear-gradient(#b9a2ff, #8f73f0); box-shadow: 0 6px 0 #6a4fd0, 0 12px 22px rgba(143, 115, 240, .3); }
  .big.alt:active { box-shadow: 0 2px 0 #6a4fd0; }
  .big[disabled] { opacity: .55; }
  .link { background: none; margin-top: 14px; font-size: 16px; font-weight: 800; color: #8f73f0; text-decoration: underline; padding: 6px; }
  #err { min-height: 22px; margin-top: 10px; font-size: 16px; font-weight: 800; color: #e2447a; }
  .codebig { font-size: 30px; font-weight: 900; letter-spacing: 4px; color: #4a3560; }

  /* ---------- игра ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; }
  #hud > * { pointer-events: auto; }
  .chip {
    position: absolute; display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 18px;
    border-radius: 28px; background: rgba(255, 252, 248, .93); font-weight: 900; font-size: 24px;
    box-shadow: 0 6px 16px rgba(40, 60, 110, .25), inset 0 0 0 3px #fff;
  }
  #stars { top: calc(12px + env(safe-area-inset-top)); left: calc(12px + env(safe-area-inset-left)); color: #e59a00; }
  #stars.pop { animation: pop .35s; }
  @keyframes pop { 40% { transform: scale(1.25); } }
  #codechip { top: calc(12px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); font-size: 17px; height: 44px; color: #8a78a8; }
  .round {
    position: absolute; width: 72px; height: 72px; border-radius: 50%; font-size: 34px; line-height: 1;
    background: rgba(255, 252, 248, .95); box-shadow: 0 6px 16px rgba(40, 60, 110, .28), inset 0 0 0 3px #fff;
    display: flex; align-items: center; justify-content: center;
  }
  .round:active { transform: scale(.93); }
  #mic { top: calc(12px + env(safe-area-inset-top)); right: calc(12px + env(safe-area-inset-right)); }
  #mic.off { background: #ffd9df; }
  #mic.off::after { content: ""; position: absolute; width: 60px; height: 6px; border-radius: 3px; background: #e2447a; transform: rotate(-45deg); }
  #mic.talk { box-shadow: 0 0 0 6px rgba(120, 220, 140, .75), 0 6px 16px rgba(40, 60, 110, .28); }
  #exit { top: calc(96px + env(safe-area-inset-top)); right: calc(12px + env(safe-area-inset-right)); width: 56px; height: 56px; font-size: 24px; margin-right: 8px; }
  #emotes { position: absolute; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; gap: 10px; }
  #emotes button { position: static; width: 66px; height: 66px; font-size: 32px; }
  #toast {
    position: absolute; left: 50%; top: calc(72px + env(safe-area-inset-top)); transform: translateX(-50%);
    max-width: 92%; padding: 12px 20px; border-radius: 20px; background: rgba(74, 53, 96, .92); color: #fff;
    font-size: 18px; font-weight: 800; text-align: center; pointer-events: none; transition: opacity .3s;
  }
  #toast.hide { opacity: 0; }
  #modal { position: fixed; inset: 0; background: rgba(40, 40, 80, .45); display: flex; align-items: center; justify-content: center; padding: 14px; }
  @media (max-height: 520px) {
    .card { padding: 14px 18px; } .card h1 { font-size: 32px; } .card .sub { margin-bottom: 8px; }
    #looks button { width: 62px; height: 76px; } #looks canvas { width: 56px; height: 70px; }
    .big { padding: 12px; margin-top: 10px; font-size: 21px; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="lobby">
  <div class="card">
    <h1>Остров</h1>
    <div class="sub">гуляем и болтаем вместе</div>

    <div class="lbl">Как тебя зовут?</div>
    <input id="name" class="txt" maxlength="14" autocomplete="off" placeholder="Имя">

    <div class="lbl">Выбери героиню</div>
    <div id="looks"></div>

    <div id="saved" class="hidden">
      <button id="play" class="big">▶ Играть</button>
      <div class="sub" style="margin:12px 0 0">наш остров: <span id="savedcode" class="codebig"></span></div>
      <button id="other" class="link">другой остров</button>
    </div>

    <div id="fresh">
      <button id="create" class="big">Создать наш остров</button>
      <button id="havecode" class="big alt">У меня есть код</button>
    </div>

    <div id="join" class="hidden">
      <div class="lbl">Код острова — 6 цифр</div>
      <input id="code" class="txt" inputmode="numeric" pattern="[0-9]*" maxlength="7" autocomplete="off" placeholder="000 000">
      <button id="enter" class="big alt">Войти на остров</button>
      <button id="back" class="link">назад</button>
    </div>

    <button id="demo" class="big alt hidden">Посмотреть без сервера</button>
    <div id="err"></div>
  </div>
</div>

<div id="hud" class="hidden">
  <div id="stars" class="chip">⭐ <span id="starn">0</span></div>
  <button id="codechip" class="chip"></button>
  <button id="mic" class="round" aria-label="Микрофон">🎤</button>
  <button id="exit" class="round" aria-label="Выйти">🚪</button>
  <div id="emotes"></div>
  <div id="toast" class="hide"></div>
</div>

<div id="modal" class="hidden">
  <div class="card">
    <div class="lbl" style="margin-top:0">Код нашего острова</div>
    <div id="modalcode" class="codebig" style="font-size:44px"></div>
    <div class="sub" style="margin:10px 0 0">Скажи его подруге или отправь ссылку её родителям</div>
    <button id="share" class="big">Отправить ссылку</button>
    <button id="closemodal" class="link">закрыть</button>
  </div>
</div>

<script>
'use strict';
/* =====================================================================
   МИР: размеры острова, где можно ходить, что где стоит
   ===================================================================== */
var W = 2400, H = 1750, CX = 1200, CY = 800, RX = 1020, RY = 660;
var WALK = 0.95, GRASS = 0.87;
function islR(a) { return 1 + 0.06 * Math.sin(3 * a + 0.5) + 0.045 * Math.sin(5 * a + 2.1) + 0.03 * Math.sin(7 * a + 4.0); }
function inIsl(x, y, m) { var dx = (x - CX) / RX, dy = (y - CY) / RY; return Math.sqrt(dx * dx + dy * dy) < islR(Math.atan2(dy, dx)) * m; }
var SAND_BOTTOM = CY + RY * islR(Math.PI / 2);
var PIER = { x0: 1150, x1: 1250, y0: CY + RY * islR(Math.PI / 2) * WALK - 60, y1: SAND_BOTTOM + 200 };
function inPier(x, y) { return x > PIER.x0 && x < PIER.x1 && y > PIER.y0 && y < PIER.y1; }

var TREES = [
  [520, 560, 0], [640, 470, 1], [820, 380, 2], [1000, 300, 0], [1420, 290, 1], [1640, 370, 2], [1860, 500, 0],
  [1990, 700, 1], [1960, 960, 0], [1800, 1180, 2], [1420, 1260, 1], [960, 1270, 0], [600, 1180, 2], [400, 860, 1],
  [860, 560, 2], [1540, 540, 0], [900, 820, 1]
];
var BUSHES = [[1060, 500], [1345, 505], [560, 780], [1540, 860], [1100, 1120], [1780, 820], [760, 620], [1300, 1010]];
var ROCKS = [[430, 1010], [1930, 1100], [1560, 330], [840, 1230]];
var HOUSE = { x: 1200, y: 600 }, SHOP = { x: 1700, y: 650 }, SWING = { x: 1620, y: 1090 }, POND = { x: 700, y: 960, rx: 150, ry: 96 }, BENCH = { x: 905, y: 1040 };

var COL = [
  { x: HOUSE.x, y: HOUSE.y - 50, rx: 160, ry: 78 },
  { x: SHOP.x, y: SHOP.y - 28, rx: 104, ry: 46 },
  { x: SWING.x, y: SWING.y - 12, rx: 96, ry: 30 },
  { x: POND.x, y: POND.y, rx: POND.rx + 14, ry: POND.ry + 12 },
  { x: BENCH.x, y: BENCH.y - 10, rx: 52, ry: 22 }
];
TREES.forEach(function (t) { COL.push({ x: t[0], y: t[1] - 8, rx: 30, ry: 20 }); });
BUSHES.forEach(function (b) { COL.push({ x: b[0], y: b[1] - 8, rx: 34, ry: 20 }); });
ROCKS.forEach(function (r) { COL.push({ x: r[0], y: r[1] - 8, rx: 34, ry: 20 }); });

/* подвинуть точку туда, где можно стоять */
function fix(p) {
  for (var i = 0; i < COL.length; i++) {
    var c = COL[i], dx = (p.x - c.x) / c.rx, dy = (p.y - c.y) / c.ry, d = dx * dx + dy * dy;
    if (d < 1) { var k = Math.sqrt(d) || 0.001; p.x = c.x + dx / k * c.rx; p.y = c.y + dy / k * c.ry; }
  }
  if (inIsl(p.x, p.y, WALK) || inPier(p.x, p.y)) return p;
  if (p.y > PIER.y0 && Math.abs(p.x - 1200) < 120) {
    p.x = Math.max(PIER.x0 + 4, Math.min(PIER.x1 - 4, p.x));
    p.y = Math.max(PIER.y0 + 4, Math.min(PIER.y1 - 4, p.y));
    return p;
  }
  var ax = (p.x - CX) / RX, ay = (p.y - CY) / RY, a = Math.atan2(ay, ax), r = islR(a) * (WALK - 0.004);
  p.x = CX + Math.cos(a) * r * RX; p.y = CY + Math.sin(a) * r * RY;
  return p;
}
function spawnOk(x, y) {
  if (!(inIsl(x, y, 0.9) || (inPier(x, y) && x > PIER.x0 + 25 && x < PIER.x1 - 25 && y < PIER.y1 - 30))) return false;
  for (var i = 0; i < COL.length; i++) {
    var c = COL[i], dx = (x - c.x) / (c.rx + 45), dy = (y - c.y) / (c.ry + 45);
    if (dx * dx + dy * dy < 1) return false;
  }
  return true;
}
/* ===== конец описания мира ===== */

var LOOKS = [
  { dress: '#ff7eb6', dress2: '#e2508f', hair: '#f4c95d', acc: 'crown' },
  { dress: '#b08cff', dress2: '#8563e0', hair: '#6b4226', acc: 'bow' },
  { dress: '#4fd3e6', dress2: '#22a7c2', hair: '#33261f', acc: 'flower' },
  { dress: '#ffd257', dress2: '#f0a92b', hair: '#c7622b', acc: 'crown' },
  { dress: '#7ed48a', dress2: '#4aae5e', hair: '#f4c95d', acc: 'bow' },
  { dress: '#ff9a6b', dress2: '#ea6c3d', hair: '#6b4226', acc: 'flower' }
];
var EMOTES = ['❤️', '👋', '😂', '👍', '🌟'];
var SPEED = 330;

/* =====================================================================
   МЕЛОЧИ
   ===================================================================== */
function $(id) { return document.getElementById(id); }
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function ell(c, x, y, rx, ry) { c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); }
function fmtCode(s) { s = String(s || ''); return s.slice(0, 3) + ' ' + s.slice(3); }

var store = { id: '', name: '', look: 0, room: '' };
try { var sv = JSON.parse(localStorage.getItem('ostrov.v1') || 'null'); if (sv) store = sv; } catch (e) { /* хранилище недоступно */ }
if (!/^[a-z0-9]{8,32}$/.test(store.id || '')) {
  store.id = ''; for (var i0 = 0; i0 < 16; i0++) store.id += 'abcdefghijklmnopqrstuvwxyz0123456789'[Math.floor(Math.random() * 36)];
}
function saveStore() { try { localStorage.setItem('ostrov.v1', JSON.stringify(store)); } catch (e) { /* ничего */ } }
saveStore();

/* =====================================================================
   РИСОВАНИЕ
   ===================================================================== */
var cv = $('game'), ctx = cv.getContext('2d');
var cw = 0, ch = 0, dpr = 1, scale = 1, cam = { x: CX, y: CY };
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cw = Math.round(window.innerWidth * dpr); ch = Math.round(window.innerHeight * dpr);
  cv.width = cw; cv.height = ch;
  scale = Math.max(cw / 1500, ch / 950);
}
window.addEventListener('resize', resize); resize();

function pathIsland(c, m, grow) {
  c.beginPath();
  for (var i = 0; i <= 180; i++) {
    var a = i / 180 * Math.PI * 2, r = islR(a) * m;
    var x = CX + Math.cos(a) * (r * RX + (grow || 0)), y = CY + Math.sin(a) * (r * RY + (grow || 0));
    if (i) c.lineTo(x, y); else c.moveTo(x, y);
  }
  c.closePath();
}

/* --- земля: рисуется один раз --- */
var GS = 1.5, ground = document.createElement('canvas');
function buildGround() {
  ground.width = W * GS; ground.height = H * GS;
  var g = ground.getContext('2d'); g.scale(GS, GS);
  var R = rng(7);
  // мелководье
  g.fillStyle = 'rgba(170,240,250,.35)'; pathIsland(g, 1, 70); g.fill();
  g.fillStyle = 'rgba(200,248,252,.5)'; pathIsland(g, 1, 34); g.fill();
  // пирс (под песком начало)
  g.fillStyle = 'rgba(40,90,120,.25)'; rr(g, PIER.x0 - 6, SAND_BOTTOM - 20, 112, PIER.y1 - SAND_BOTTOM + 34, 10); g.fill();
  // песок
  var sg = g.createRadialGradient(CX, CY, 300, CX, CY, 1050);
  sg.addColorStop(0, '#fbeecb'); sg.addColorStop(1, '#f3d99d');
  g.fillStyle = sg; pathIsland(g, 1, 0); g.fill();
  g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = 8; g.stroke();
  // трава
  var gg = g.createLinearGradient(0, 150, 0, 1450);
  gg.addColorStop(0, '#9be07a'); gg.addColorStop(1, '#6cc56a');
  g.fillStyle = '#58b060'; pathIsland(g, GRASS, 8); g.fill();
  g.fillStyle = gg; pathIsland(g, GRASS, 0); g.fill();
  // пятна травы
  g.save(); pathIsland(g, GRASS, 0); g.clip();
  for (var i = 0; i < 90; i++) {
    var x = 200 + R() * 2000, y = 150 + R() * 1300;
    g.fillStyle = R() < 0.5 ? 'rgba(190,240,140,.28)' : 'rgba(60,150,80,.13)';
    ell(g, x, y, 40 + R() * 110, 18 + R() * 46); g.fill();
  }
  g.restore();
  // тропинки
  function pathTo(pts, w) {
    g.lineCap = 'round'; g.lineJoin = 'round';
    g.beginPath(); g.moveTo(pts[0], pts[1]);
    for (var k = 2; k < pts.length; k += 4) g.quadraticCurveTo(pts[k], pts[k + 1], pts[k + 2], pts[k + 3]);
    g.strokeStyle = '#d9b877'; g.lineWidth = w + 10; g.stroke();
    g.strokeStyle = '#f2dcab'; g.lineWidth = w; g.stroke();
  }
  pathTo([1200, 640, 1190, 1000, 1200, PIER.y0 + 30], 58);
  pathTo([1200, 760, 1480, 700, 1690, 720], 46);
  pathTo([1200, 860, 1000, 900, 880, 1075, 860, 1100, 800, 1090], 44);
  pathTo([1200, 960, 1420, 1010, 1600, 1130], 44);
  // камушки на тропинке
  for (i = 0; i < 60; i++) {
    g.fillStyle = 'rgba(190,150,90,.35)';
    ell(g, 1180 + R() * 40, 660 + R() * 720, 3 + R() * 4, 2 + R() * 3); g.fill();
  }
  // пруд
  g.fillStyle = '#58b060'; ell(g, POND.x, POND.y + 6, POND.rx + 12, POND.ry + 10); g.fill();
  g.fillStyle = '#e9d6a3'; ell(g, POND.x, POND.y, POND.rx + 8, POND.ry + 6); g.fill();
  var pg = g.createRadialGradient(POND.x - 30, POND.y - 30, 10, POND.x, POND.y, POND.rx);
  pg.addColorStop(0, '#aeeaf7'); pg.addColorStop(1, '#4fb9e2');
  g.fillStyle = pg; ell(g, POND.x, POND.y, POND.rx, POND.ry); g.fill();
  g.strokeStyle = 'rgba(255,255,255,.6)'; g.lineWidth = 4; g.beginPath(); g.ellipse(POND.x - 30, POND.y - 20, 70, 36, -0.2, 3.4, 4.6); g.stroke();
  [[-60, 30], [50, 40], [20, -40], [90, -5]].forEach(function (l, n) {
    g.fillStyle = '#4fb565'; g.beginPath(); g.moveTo(POND.x + l[0], POND.y + l[1]);
    g.arc(POND.x + l[0], POND.y + l[1], 20, 0.4, Math.PI * 2 - 0.1); g.closePath(); g.fill();
    if (n % 2 === 0) flower(g, POND.x + l[0] + 3, POND.y + l[1] - 3, 7, '#ffd0e6', '#ffe36b');
  });
  // цветы
  var fc = ['#ff8ec0', '#ffffff', '#ffd257', '#c9a4ff', '#ff9a6b'];
  for (i = 0; i < 230; i++) {
    x = 220 + R() * 1960; y = 170 + R() * 1260;
    if (!inIsl(x, y, GRASS - 0.04)) continue;
    var dxp = (x - POND.x) / (POND.rx + 20), dyp = (y - POND.y) / (POND.ry + 20);
    if (dxp * dxp + dyp * dyp < 1) continue;
    if (R() < 0.35) { // травинки
      g.strokeStyle = 'rgba(50,140,70,.5)'; g.lineWidth = 2.5; g.beginPath();
      g.moveTo(x, y); g.lineTo(x - 4, y - 11); g.moveTo(x + 4, y); g.lineTo(x + 5, y - 13); g.moveTo(x + 8, y); g.lineTo(x + 12, y - 10); g.stroke();
    } else flower(g, x, y, 4.5 + R() * 3, fc[Math.floor(R() * fc.length)], '#ffe36b');
  }
  // ракушки и морские звёзды на песке
  for (i = 0; i < 46; i++) {
    var a = R() * Math.PI * 2, rr2 = islR(a) * (0.905 + R() * 0.075);
    x = CX + Math.cos(a) * rr2 * RX; y = CY + Math.sin(a) * rr2 * RY;
    if (R() < 0.6) { g.fillStyle = R() < 0.5 ? '#ffd9c2' : '#fff5e6'; ell(g, x, y, 7, 5); g.fill(); g.strokeStyle = 'rgba(200,140,110,.6)'; g.lineWidth = 1.5; g.stroke(); }
    else { starPath(g, x, y, 9, 4.5, R() * 3); g.fillStyle = '#ff9a7a'; g.fill(); }
  }
  // пирс

  TREES.forEach(function (t) { list.push({ y: t[1], k: 'tree' + t[2], x: t[0] }); });
  BUSHES.forEach(function (b) { list.push({ y: b[1], k: 'bush', x: b[0] }); });
  ROCKS.forEach(function (r) { list.push({ y: r[1], k: 'rock', x: r[0] }); });
  list.push({ y: HOUSE.y, k: 'house', x: HOUSE.x }, { y: SHOP.y, k: 'shop', x: SHOP.x }, { y: SWING.y, k: 'swing', x: SWING.x }, { y: BENCH.y, k: 'bench', x: BENCH.x });
  stars.forEach(function (s) { list.push({ y: s.y, star: s }); });
  players.forEach(function (p) { list.push({ y: p.y, pl: p }); });
  list.sort(function (a, b) { return a.y - b.y; });
  for (var li = 0; li < list.length; li++) {
    var o = list[li];
    if (o.x !== undefined && (o.x < x0 - 220 || o.x > x0 + vw + 220 || o.y < y0 - 60 || o.y > y0 + vh + 400)) continue;
    if (o.k) drawSpr(o.k, o.x, o.y);
    else if (o.star) {
      var st = o.star, age = Math.min(1, (T - st.born) * 2.5), bobS = Math.sin(T * 3 + st.id) * 6;
      ctx.fillStyle = 'rgba(30,60,40,.18)'; ell(ctx, st.x, st.y, 20 * age, 6 * age); ctx.fill();
      drawSpr('star', st.x, st.y - 38 + bobS, age * (0.62 + 0.04 * Math.sin(T * 5 + st.id)));
    } else {
      var p = o.pl;
      drawGirl(ctx, p.x, p.y, 1, LOOKS[p.look] || LOOKS[0], { mv: p.mv, ph: p.ph, t: T, face: p.face, seed: p.seed, talk: p.talk });
    }
  }
  // искры
  for (var pi = parts.length - 1; pi >= 0; pi--) {
    var q = parts[pi]; q.t += dt; if (q.t > q.life) { parts.splice(pi, 1); continue; }
    q.vy += 500 * dt; q.x += q.vx * dt; q.y += q.vy * dt;
    ctx.globalAlpha = 1 - q.t / q.life; starPath(ctx, q.x, q.y, 9, 4, q.t * 8); ctx.fillStyle = q.c; ctx.fill();
  }
  ctx.globalAlpha = 1;
  // подписи, речь, смайлики — поверх всего
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  players.forEach(function (p) {
    ctx.font = '800 21px ui-rounded, system-ui, sans-serif';
    var tw = ctx.measureText(p.name).width, bw = tw + 30 + (p !== me ? 18 : 0), by = p.y - 172;
    ctx.fillStyle = p === me ? 'rgba(255,255,255,.95)' : 'rgba(255,255,255,.82)'; rr(ctx, p.x - bw / 2, by - 16, bw, 32, 16); ctx.fill();
    ctx.fillStyle = '#4a3560'; ctx.fillText(p.name, p.x + (p !== me ? 9 : 0), by + 1);
    if (p !== me && !demo) { // огонёк голосовой связи
      ctx.fillStyle = p.rtc === 'connected' ? '#43c463' : (p.rtc === 'failed' ? '#e2447a' : '#f0a92b');
      ell(ctx, p.x - bw / 2 + 16, by, 6, 6); ctx.fill();
    }
    if (p.talk) {
      ctx.strokeStyle = '#43c463'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      for (var k = 0; k < 3; k++) { var a = 0.5 + 0.5 * Math.sin(T * 9 - k * 1.1); ctx.globalAlpha = 0.35 + 0.65 * a; ctx.beginPath(); ctx.arc(p.x + 30, p.y - 104, 12 + k * 9, -0.6, 0.6); ctx.stroke(); }
      ctx.globalAlpha = 1;
    }
    if (p.em) {
      var et = T - p.emT; if (et > 2.6) { p.em = null; return; }
      var es = Math.min(1, et * 7) * (et > 2.2 ? Math.max(0, (2.6 - et) / 0.4) : 1), ey = by - 54 - Math.min(et, 0.4) * 24;
      ctx.save(); ctx.translate(p.x, ey); ctx.scale(es, es);
      ctx.fillStyle = '#fff'; ell(ctx, 0, 0, 38, 34); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-10, 28); ctx.lineTo(0, 46); ctx.lineTo(12, 28); ctx.closePath(); ctx.fill();
      ctx.font = '40px system-ui, sans-serif'; ctx.fillText(p.em, 0, 3); ctx.restore();
    }
  });
}

buildGround(); buildSprites();
requestAnimationFrame(frame);
</script>
