<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Остров</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#49bfe6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Остров">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #49bfe6; }
  body {
    font-family: ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    color: #4a3560; user-select: none; -webkit-user-select: none; touch-action: none;
    overscroll-behavior: none;
  }
  canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }
  .hidden { display: none !important; }

  /* ---------- вход ---------- */
  #lobby {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: 12px; background: rgba(60, 150, 200, .28); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    overflow: auto; touch-action: pan-y;
  }
  .card {
    width: min(560px, 100%); background: rgba(255, 252, 248, .96); border-radius: 32px;
    padding: 22px 22px 20px; box-shadow: 0 18px 50px rgba(40, 60, 110, .35), inset 0 0 0 3px #fff;
    text-align: center; margin: auto;
  }
  .card h1 { margin: 0; font-size: 44px; line-height: 1; font-weight: 900; color: #ff5fa2; letter-spacing: 1px;
    text-shadow: 0 3px 0 #ffd3e6; }
  .card .sub { margin: 6px 0 16px; font-size: 16px; font-weight: 700; color: #8a78a8; }
  .lbl { font-size: 14px; font-weight: 800; color: #8a78a8; margin: 12px 0 6px; text-transform: uppercase; letter-spacing: .6px; }
  input.txt {
    width: 100%; font: inherit; font-size: 24px; font-weight: 800; text-align: center; color: #4a3560;
    padding: 12px 14px; border-radius: 18px; border: 3px solid #e7dcf5; background: #fff; outline: none;
    user-select: text; -webkit-user-select: text;
  }
  input.txt:focus { border-color: #ff9cc7; }
  #looks { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  #looks button {
    width: 76px; height: 92px; padding: 0; border-radius: 18px; background: #f4eefb; border: 3px solid transparent;
    transition: transform .12s;
  }
  #looks button.on { border-color: #ff7eb6; background: #ffe9f3; transform: scale(1.07); }
  #looks canvas { width: 70px; height: 86px; display: block; }
  .big {
    display: block; width: 100%; margin-top: 14px; padding: 16px 18px; border-radius: 22px;
    font-size: 24px; font-weight: 900; color: #fff; background: linear-gradient(#ff8ec0, #ff5fa2);
    box-shadow: 0 6px 0 #d9417f, 0 12px 22px rgba(255, 95, 162, .35);
  }
  .big:active { transform: translateY(4px); box-shadow: 0 2px 0 #d9417f; }
  .big.alt { background: linear-gradient(#b9a2ff, #8f73f0); box-shadow: 0 6px 0 #6a4fd0, 0 12px 22px rgba(143, 115, 240, .3); }
  .big.alt:active { box-shadow: 0 2px 0 #6a4fd0; }
  .big[disabled] { opacity: .55; }
  .link { background: none; margin-top: 14px; font-size: 16px; font-weight: 800; color: #8f73f0; text-decoration: underline; padding: 6px; }
  #err { min-height: 22px; margin-top: 10px; font-size: 16px; font-weight: 800; color: #e2447a; }
  .codebig { font-size: 30px; font-weight: 900; letter-spacing: 4px; color: #4a3560; }

  /* ---------- игра ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; }
  #hud > * { pointer-events: auto; }
  #tl { position: absolute; top: calc(12px + env(safe-area-inset-top)); left: calc(12px + env(safe-area-inset-left)); display: flex; gap: 10px; pointer-events: none !important; }
  #tl > * { pointer-events: auto; }
  .chip {
    display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 18px;
    border-radius: 28px; background: rgba(255, 252, 248, .93); font-weight: 900; font-size: 24px;
    box-shadow: 0 6px 16px rgba(40, 60, 110, .25), inset 0 0 0 3px #fff; white-space: nowrap;
  }
  #stars { color: #e59a00; }
  #stars.pop { animation: pop .35s; }
  @keyframes pop { 40% { transform: scale(1.25); } }
  #radar { font-size: 19px; color: #fff; box-shadow: 0 6px 16px rgba(40, 60, 110, .25); transition: background .3s; }
  #radar.r0 { background: #6fa8e8; } #radar.r1 { background: #58c0b0; } #radar.r2 { background: #f0b02b; }
  #radar.r3 { background: #f2702f; animation: pulse .7s infinite; } #radar.r4 { background: #e2305f; animation: pulse .35s infinite; }
  @keyframes pulse { 50% { transform: scale(1.09); } }
  .round {
    position: absolute; width: 72px; height: 72px; border-radius: 50%; font-size: 34px; line-height: 1;
    background: rgba(255, 252, 248, .95); box-shadow: 0 6px 16px rgba(40, 60, 110, .28), inset 0 0 0 3px #fff;
    display: flex; align-items: center; justify-content: center;
  }
  .round:active { transform: scale(.93); }
  .round.sm { width: 54px; height: 54px; font-size: 24px; margin-right: 9px; }
  #mic { top: calc(12px + env(safe-area-inset-top)); right: calc(12px + env(safe-area-inset-right)); }
  #mic.off { background: #ffd9df; }
  #mic.off::after { content: ""; position: absolute; width: 60px; height: 6px; border-radius: 3px; background: #e2447a; transform: rotate(-45deg); }
  #mic.talk { box-shadow: 0 0 0 6px rgba(120, 220, 140, .75), 0 6px 16px rgba(40, 60, 110, .28); }
  #exit { top: calc(96px + env(safe-area-inset-top)); right: calc(12px + env(safe-area-inset-right)); }
  #codebtn { top: calc(160px + env(safe-area-inset-top)); right: calc(12px + env(safe-area-inset-right)); }
  #emotes { position: absolute; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; gap: 10px; }
  #emotes button { position: static; width: 66px; height: 66px; font-size: 32px; }
  #dig {
    position: absolute; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    padding: 16px 34px; border-radius: 40px; font-size: 30px; font-weight: 900; color: #fff; white-space: nowrap;
    background: linear-gradient(#ffcf4a, #f59a12); box-shadow: 0 7px 0 #c97200, 0 14px 26px rgba(200, 120, 0, .4);
    animation: digp .6s infinite;
  }
  @keyframes digp { 50% { transform: translateX(-50%) scale(1.08); } }
  #toast {
    position: absolute; left: 50%; top: calc(84px + env(safe-area-inset-top)); transform: translateX(-50%);
    max-width: 92%; padding: 12px 20px; border-radius: 20px; background: rgba(74, 53, 96, .92); color: #fff;
    font-size: 19px; font-weight: 800; text-align: center; pointer-events: none !important; transition: opacity .3s;
  }
  #toast.hide { opacity: 0; }
  #decor { top: calc(224px + env(safe-area-inset-top)); right: calc(12px + env(safe-area-inset-right)); }
  #decor.on { background: #ffe36b; }
  #shopbtn {
    position: absolute; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    padding: 16px 34px; border-radius: 40px; font-size: 28px; font-weight: 900; color: #fff; white-space: nowrap;
    background: linear-gradient(#ff8ec0, #ff5fa2); box-shadow: 0 7px 0 #d9417f, 0 14px 26px rgba(255, 95, 162, .4);
  }
  #tray {
    position: absolute; left: 50%; bottom: calc(10px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    max-width: calc(100% - 20px); display: flex; gap: 8px; padding: 8px; border-radius: 26px; overflow-x: auto; touch-action: pan-x;
    background: rgba(255, 252, 248, .95); box-shadow: 0 6px 16px rgba(40, 60, 110, .28), inset 0 0 0 3px #fff;
  }
  #tray .hint { padding: 16px 14px; font-size: 18px; font-weight: 800; color: #8a78a8; white-space: nowrap; }
  .it { position: relative; flex: 0 0 auto; width: 84px; height: 84px; padding: 0; border-radius: 18px; background: #f4eefb; border: 3px solid transparent; }
  .it.on { border-color: #ff7eb6; background: #ffe9f3; }
  .it canvas { width: 76px; height: 76px; display: block; margin: 1px auto; }
  .it b { position: absolute; right: -4px; top: -4px; min-width: 26px; height: 26px; border-radius: 13px; background: #ff5fa2; color: #fff; font-size: 15px; line-height: 26px; }
  #shopgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 12px; max-height: 46vh; overflow-y: auto; touch-action: pan-y; padding: 4px; }
  #shopgrid button { position: relative; padding: 6px 4px 8px; border-radius: 18px; background: #f4eefb; font-weight: 900; font-size: 17px; color: #e59a00; }
  #shopgrid button canvas { width: 100%; aspect-ratio: 1; display: block; }
  #shopgrid button.poor { opacity: .5; }
  #shopgrid button.on { background: #ffe9f3; box-shadow: inset 0 0 0 3px #ff7eb6; opacity: 1; }
  #shopgrid button i { position: absolute; left: 6px; top: 4px; font-style: normal; font-size: 13px; color: #8a78a8; }
  #shopgrid button:active:not([disabled]) { transform: scale(.94); background: #ffe9f3; }
  #jump { bottom: calc(14px + env(safe-area-inset-bottom)); right: calc(12px + env(safe-area-inset-right)); }
  #ride { bottom: calc(98px + env(safe-area-inset-bottom)); right: calc(12px + env(safe-area-inset-right)); }
  #ride.on { background: #ffe36b; }
  #dance { bottom: calc(164px + env(safe-area-inset-bottom)); right: calc(12px + env(safe-area-inset-right)); }
  #games { bottom: calc(14px + env(safe-area-inset-bottom)); left: calc(12px + env(safe-area-inset-left)); }
  #act {
    position: absolute; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    padding: 14px 30px; border-radius: 40px; font-size: 27px; font-weight: 900; color: #fff; white-space: nowrap;
    background: linear-gradient(#b9a2ff, #8f73f0); box-shadow: 0 7px 0 #6a4fd0, 0 14px 26px rgba(143, 115, 240, .4);
  }
  #gbar {
    position: absolute; left: 50%; top: calc(12px + env(safe-area-inset-top)); transform: translateX(-50%);
    height: 50px; padding: 0 20px; border-radius: 25px; display: flex; align-items: center; white-space: nowrap;
    background: #ff7a3d; color: #fff; font-size: 21px; font-weight: 900; box-shadow: 0 6px 16px rgba(40, 60, 110, .3);
  }
  @media (max-width: 760px) { #gbar { top: calc(146px + env(safe-area-inset-top)); font-size: 17px; height: 42px; }
    #jump { bottom: calc(86px + env(safe-area-inset-bottom)); } #ride { bottom: calc(170px + env(safe-area-inset-bottom)); } #dance { bottom: calc(236px + env(safe-area-inset-bottom)); } #games { bottom: calc(86px + env(safe-area-inset-bottom)); }
    #act, #dig, #shopbtn { bottom: calc(168px + env(safe-area-inset-bottom)); font-size: 22px; } }
  .wrow { display: flex; gap: 12px; align-items: flex-start; margin-top: 8px; }
  #wprev { width: 140px; height: 170px; flex: 0 0 auto; background: #f4eefb; border-radius: 20px; }
  .wside { flex: 1; min-width: 0; }
  #wtabs { display: flex; gap: 6px; justify-content: center; }
  #wtabs button { width: 54px; height: 54px; border-radius: 50%; font-size: 26px; background: #f4eefb; padding: 0; }
  #wtabs button.on { background: #ffe36b; box-shadow: inset 0 0 0 3px #f0a92b; }
  #wgrid, #pgrid { display: grid; gap: 8px; margin-top: 10px; }
  #wgrid { grid-template-columns: repeat(4, 1fr); max-height: 38vh; overflow-y: auto; touch-action: pan-y; padding: 3px; }
  #pgrid { grid-template-columns: repeat(3, 1fr); }
  #wgrid button, #pgrid button { position: relative; padding: 2px; border-radius: 16px; background: #f4eefb; font-weight: 900; font-size: 15px; color: #e2447a; }
  #wgrid button canvas, #pgrid button canvas { width: 100%; display: block; }
  #wgrid button.on, #pgrid button.on { background: #ffe9f3; box-shadow: inset 0 0 0 3px #ff7eb6; }
  #wgrid button b { position: absolute; left: 3px; right: 3px; bottom: 3px; border-radius: 10px; background: rgba(255, 255, 255, .92); color: #e59a00; font-size: 13px; line-height: 20px; }
  #pgrid button.no canvas { filter: grayscale(1) brightness(1.5); opacity: .35; }
  @media (max-width: 520px) { #wprev { width: 96px; height: 117px; } #wtabs button { width: 44px; height: 44px; font-size: 21px; } #wgrid { grid-template-columns: repeat(3, 1fr); } }
  .modalbg { position: fixed; inset: 0; background: rgba(40, 40, 80, .45); display: flex; align-items: center; justify-content: center; padding: 14px; overflow: auto; touch-action: pan-y; }
  #albumgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 12px; }
  #albumgrid div { aspect-ratio: 1; border-radius: 18px; background: #f4eefb; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 38px; line-height: 1.1; }
  #albumgrid div small { font-size: 11px; font-weight: 800; color: #8a78a8; margin-top: 2px; }
  #albumgrid div.no { color: #cdbfe2; font-weight: 900; }
  #albumgrid div.yes { background: #fff3c4; box-shadow: inset 0 0 0 3px #ffd257; }
  @media (max-height: 520px) {
    .card { padding: 14px 18px; } .card h1 { font-size: 32px; } .card .sub { margin-bottom: 8px; }
    #looks button { width: 62px; height: 76px; } #looks canvas { width: 56px; height: 70px; }
    .big { padding: 12px; margin-top: 10px; font-size: 21px; }
    #albumgrid, #shopgrid { grid-template-columns: repeat(6, 1fr); } #albumgrid div { font-size: 28px; }
  }
  @media (max-width: 520px) { #emotes button { width: 56px; height: 56px; font-size: 27px; } #emotes { gap: 7px; } .chip { height: 50px; padding: 0 14px; font-size: 21px; } #radar { font-size: 16px; } }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="lobby">
  <div class="card">
    <h1>Остров</h1>
    <div class="sub">гуляем, болтаем и ищем сокровища</div>

    <div class="lbl">Как тебя зовут?</div>
    <input id="name" class="txt" maxlength="14" autocomplete="off" placeholder="Имя">

    <div class="lbl">Выбери героиню</div>
    <div id="looks"></div>

    <div id="saved" class="hidden">
      <button id="play" class="big">▶ Играть</button>
      <div class="sub" style="margin:12px 0 0">наш остров: <span id="savedcode" class="codebig"></span></div>
      <button id="other" class="link">другой остров</button>
    </div>

    <div id="fresh">
      <button id="create" class="big">Создать наш остров</button>
      <button id="havecode" class="big alt">У меня есть код</button>
    </div>

    <div id="join" class="hidden">
      <div class="lbl">Код острова — 6 цифр</div>
      <input id="code" class="txt" inputmode="numeric" pattern="[0-9]*" maxlength="7" autocomplete="off" placeholder="000 000">
      <button id="enter" class="big alt">Войти на остров</button>
      <button id="back" class="link">назад</button>
    </div>

    <button id="demo" class="big alt hidden">Посмотреть без сервера</button>
    <button id="voicebtn" class="link"></button>
    <div id="err"></div>
  </div>
</div>

<div id="hud" class="hidden">
  <div id="tl">
    <button id="stars" class="chip">⭐ <span id="starn">0</span></button>
    <div id="radar" class="chip hidden"><span>🧭</span><span id="radartx"></span></div>
  </div>
  <button id="mic" class="round" aria-label="Микрофон">🎤</button>
  <button id="exit" class="round sm" aria-label="Выйти">🚪</button>
  <button id="codebtn" class="round sm" aria-label="Код острова">🔑</button>
  <button id="decor" class="round sm hidden" aria-label="Обставить домик">🛋</button>
  <button id="jump" class="round" aria-label="Прыгнуть">🦘</button>
  <button id="ride" class="round sm" aria-label="Единорог">🦄</button>
  <button id="dance" class="round sm" aria-label="Танцевать">💃</button>
  <button id="games" class="round" aria-label="Игры">🎮</button>
  <div id="gbar" class="hidden"></div>
  <button id="act" class="hidden"></button>
  <button id="dig" class="hidden">⛏ Копать!</button>
  <button id="shopbtn" class="hidden">🛍 Лавка</button>
  <div id="tray" class="hidden"></div>
  <div id="emotes"></div>
  <div id="toast" class="hide"></div>
</div>

<div id="modal" class="modalbg hidden">
  <div class="card">
    <div class="lbl" style="margin-top:0">Код нашего острова</div>
    <div id="modalcode" class="codebig" style="font-size:44px"></div>
    <div class="sub" style="margin:10px 0 0">Скажи его подруге или отправь ссылку её родителям</div>
    <button id="share" class="big">Отправить ссылку</button>
    <button id="closemodal" class="link">закрыть</button>
  </div>
</div>

<div id="gamesm" class="modalbg hidden">
  <div class="card">
    <div class="lbl" style="margin-top:0">Во что играем?</div>
    <button id="gtag" class="big">🏃 Догонялки</button>
    <button id="ghide" class="big alt">🙈 Прятки</button>
    <button id="gstop" class="big hidden" style="background:linear-gradient(#ffb08a,#ff7a3d);box-shadow:0 6px 0 #d3561e">⏹ Закончить игру</button>
    <button id="closegames" class="link">закрыть</button>
  </div>
</div>

<div id="wardm" class="modalbg hidden">
  <div class="card">
    <div class="lbl" style="margin-top:0">Наряды · у нас <span id="wbal"></span> ⭐</div>
    <div class="wrow">
      <canvas id="wprev" width="280" height="340"></canvas>
      <div class="wside"><div id="wtabs"></div><div id="wgrid"></div></div>
    </div>
    <button id="wbuy" class="big hidden"></button>
    <button id="closeward" class="big alt">Готово</button>
  </div>
</div>

<div id="petsm" class="modalbg hidden">
  <div class="card">
    <div class="lbl" style="margin-top:0">Питомцы · у нас <span id="pbal"></span> ⭐</div>
    <div id="pgrid"></div>
    <div id="pinfo" class="sub" style="margin:10px 0 0;min-height:22px"></div>
    <button id="ptake" class="big hidden"></button>
    <button id="pfeed" class="big alt hidden"></button>
    <button id="pegg" class="big" style="background:linear-gradient(#ffcf4a,#f59a12);box-shadow:0 6px 0 #c97200"></button>
    <button id="closepets" class="link">закрыть</button>
  </div>
</div>

<div id="shop" class="modalbg hidden">
  <div class="card">
    <div class="lbl" style="margin-top:0">Лавка · у нас <span id="shopbal"></span> ⭐</div>
    <div id="shopgrid"></div>
    <button id="buy" class="big" disabled>Выбери вещь</button>
    <button id="closeshop" class="link">закрыть</button>
  </div>
</div>

<div id="album" class="modalbg hidden">
  <div class="card">
    <div class="lbl" style="margin-top:0">Наши сокровища</div>
    <div id="albumn" class="codebig"></div>
    <div id="albumgrid"></div>
    <button id="closealbum" class="big alt">Закрыть</button>
  </div>
</div>

<script>
'use strict';
/* =====================================================================
   МИР: остров, горы, тайная бухта и пещера. Здесь только расчёты, без рисования.
   ===================================================================== */
var W = 5200, H = 3900, CX = 2600, CY = 1900, RX = 2350, RY = 1600, WALK = 0.955;
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function islR(a) { return 1 + 0.05 * Math.sin(3 * a + 0.5) + 0.04 * Math.sin(5 * a + 2.1) + 0.025 * Math.sin(7 * a + 4.0) + 0.02 * Math.sin(11 * a + 1.0); }
/* 0 — в центре острова, 1 — у самой воды, больше 1 — море */
function isl(x, y) { var dx = (x - CX) / RX, dy = (y - CY) / RY; return Math.sqrt(dx * dx + dy * dy) / islR(Math.atan2(dy, dx)); }
function grassM(a) { return 0.9 - 0.17 * Math.exp(-a * a / 0.5); } /* на востоке широкий пляж */
function inGrass(x, y) { var dx = (x - CX) / RX, dy = (y - CY) / RY, a = Math.atan2(dy, dx); return Math.sqrt(dx * dx + dy * dy) < islR(a) * grassM(a); }
/* горная гряда поперёк острова: через неё не пройти, только сквозь пещеру */
var BAND = 220;
function bandC(x) { return 980 + 40 * Math.sin(x / 420); }
function inBand(x, y) { return Math.abs(y - bandC(x)) < BAND; }
var SAND_BOTTOM = CY + RY * islR(Math.PI / 2);
var PIER = { x0: 2550, x1: 2650, y0: CY + RY * islR(Math.PI / 2) * WALK - 60, y1: SAND_BOTTOM + 220 };
function inPier(x, y) { return x > PIER.x0 && x < PIER.x1 && y > PIER.y0 && y < PIER.y1; }

var HOUSE = { x: 2600, y: 2050 }, SHOP = { x: 3180, y: 2130 }, SWING = { x: 3060, y: 2570 }, POND = { x: 2040, y: 2450, rx: 170, ry: 105 }, BENCH = { x: 2290, y: 2570 };
var CLEAR = { x: 1150, y: 2100, r: 190 };

  if (y0 + vh > SAND_BOTTOM - 80 && x0 < PIER.x1 + 40 && x0 + vw > PIER.x0 - 40) {
    var py0 = SAND_BOTTOM - 46, yy;
    ctx.fillStyle = 'rgba(40,90,120,.22)'; rr(ctx, PIER.x0 - 6, SAND_BOTTOM - 10, 112, PIER.y1 - SAND_BOTTOM + 24, 10); ctx.fill();
    ctx.fillStyle = '#8a5a3a';
    for (yy = py0 + 60; yy < PIER.y1; yy += 78) { rr(ctx, PIER.x0 - 10, yy, 14, 30, 5); ctx.fill(); rr(ctx, PIER.x1 - 4, yy, 14, 30, 5); ctx.fill(); }
    ctx.fillStyle = '#c98f5a'; rr(ctx, PIER.x0, py0, PIER.x1 - PIER.x0, PIER.y1 - py0, 12); ctx.fill();
    ctx.strokeStyle = '#a66f42'; ctx.lineWidth = 3;
    for (yy = py0 + 22; yy < PIER.y1 - 6; yy += 22) { ctx.beginPath(); ctx.moveTo(PIER.x0 + 3, yy); ctx.lineTo(PIER.x1 - 3, yy); ctx.stroke(); }
  }
  // цветы, грибы, ракушки
  for (var i = 0; i < DECOR.length; i++) { var d = DECOR[i]; if (d[0] > x0 - 20 && d[0] < x0 + vw + 20 && d[1] > y0 - 20 && d[1] < y0 + vh + 30) drawSpr('d' + d[2], d[0], d[1]); }
  // место звездопада
  if (ev) { ctx.fillStyle = 'rgba(255,240,150,' + (0.16 + 0.1 * Math.sin(T * 5)) + ')'; ell(ctx, ev.x, ev.y, 420, 300); ctx.fill(); }
  drawSorted(OBJ0, x0, y0, vw, vh, 0);
  // бабочки
  crit.forEach(function (b, n) {
    b.a += dt * (0.5 + n % 3 * 0.2); var bx = b.hx + Math.cos(b.a) * 150 + Math.sin(b.a * 2.3) * 60, by = b.hy + Math.sin(b.a * 1.3) * 100 - 60;
    if (bx < x0 - 30 || bx > x0 + vw + 30 || by < y0 - 30 || by > y0 + vh + 30) return;
    var f = Math.abs(Math.sin(T * 14 + n)) * 9 + 2; ctx.fillStyle = b.c;
    ctx.beginPath(); ctx.ellipse(bx - f / 2, by, f, 9, -0.4, 0, 6.29); ctx.ellipse(bx + f / 2, by, f, 9, 0.4, 0, 6.29); ctx.fill();
    ctx.fillStyle = '#4a3560'; ell(ctx, bx, by, 1.8, 6); ctx.fill();
  });
  if (ev && Math.random() < 0.5) parts.push({ x: ev.x + (Math.random() - 0.5) * 700, y: ev.y - 500 - Math.random() * 200, vx: -60, vy: 500, t: 0, life: 0.9, c: '#fff3a0', m: 0 });
}

function drawCave(dt, x0, y0, vw, vh) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#120e1f'; ctx.fillRect(0, 0, cw, ch);
  ctx.setTransform(scale, 0, 0, scale, cw / 2 - cam.x * scale, ch / 2 - cam.y * scale);
  ctx.drawImage(caveGround, 0, 0);
  ctx.fillStyle = 'rgba(255,255,255,' + (0.25 + 0.15 * Math.sin(T * 2)) + ')'; ctx.beginPath(); ctx.ellipse(LAKE.x - 20, LAKE.y - 12, 40, 14, -0.2, 0, 6.29); ctx.fill();
  drawSorted(OBJ1, x0, y0, vw, vh, 1);
  bats.forEach(function (b, n) {
    b.a += dt * (0.9 + n % 3 * 0.3); var bx = b.hx + Math.cos(b.a) * b.r, by = b.hy + Math.sin(b.a * 1.7) * b.r * 0.6 - 90, f = Math.sin(T * 16 + n) * 10;
    ctx.fillStyle = '#2a2140'; ctx.beginPath(); ctx.moveTo(bx, by); ctx.quadraticCurveTo(bx - 16, by - 14 - f, bx - 30, by + f * 0.5); ctx.quadraticCurveTo(bx - 14, by + 2, bx, by + 8);
    ctx.quadraticCurveTo(bx + 14, by + 2, bx + 30, by + f * 0.5); ctx.quadraticCurveTo(bx + 16, by - 14 - f, bx, by); ctx.fill();
  });
}
function drawHouse(dt, x0, y0, vw, vh) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#3b2a55'; ctx.fillRect(0, 0, cw, ch);
  ctx.setTransform(scale, 0, 0, scale, cw / 2 - cam.x * scale, ch / 2 - cam.y * scale);
  ctx.drawImage(houseBg, 0, 0);
  furn.forEach(function (f) { var c = CAT[f.i]; if (c && c.t !== 'floor') drawSpr('f' + f.i, f.x, f.y); });
  if (decor && sel >= 0) { ctx.fillStyle = 'rgba(255,255,255,' + (0.12 + 0.08 * Math.sin(T * 5)) + ')'; if (CAT[sel].t === 'wall') ctx.fillRect(40, 30, HW - 80, HWALL - 12); else ctx.fillRect(40, HWALL + 12, HW - 80, HH - HWALL - 42); }
  drawSorted(houseObjs, x0, y0, vw, vh, 2);
}
function drawDark() { // темнота с кругами света
  var s2 = scale / 2, ox = dk.width / 2 - cam.x * s2, oy = dk.height / 2 - cam.y * s2;
  dctx.setTransform(1, 0, 0, 1, 0, 0); dctx.globalCompositeOperation = 'source-over';
  dctx.clearRect(0, 0, dk.width, dk.height); dctx.fillStyle = 'rgba(10,7,26,.95)'; dctx.fillRect(0, 0, dk.width, dk.height);
  dctx.globalCompositeOperation = 'destination-out'; dctx.setTransform(s2, 0, 0, s2, ox, oy);
  function light(x, y, r, a) {
    var g = dctx.createRadialGradient(x, y, r * 0.15, x, y, r); g.addColorStop(0, 'rgba(0,0,0,' + a + ')'); g.addColorStop(1, 'rgba(0,0,0,0)');
    dctx.fillStyle = g; dctx.beginPath(); dctx.arc(x, y, r, 0, 6.29); dctx.fill();
  }
  players.forEach(function (p) { if (p.m === 1) light(p.x, p.y - 50, 330 + Math.sin(T * 3 + p.seed) * 8, 1); });
  CRYST.forEach(function (c, i) { light(c.x, c.y - 40, 130 + Math.sin(T * 2 + i) * 14, 0.55); });
  stars.forEach(function (s) { if (s.m === 1) light(s.x, s.y - 30, 90, 0.6); });
  CHESTS.forEach(function (c) { if (c.m === 1) light(c.x, c.y - 30, chestOpen[c.id] ? 170 : 110, 0.6); });
  light(LAKE.x, LAKE.y, 250, 0.7); light(EXIT_S.x, EXIT_S.y, 250, 0.9); light(EXIT_N.x, EXIT_N.y, 230, 0.9);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(dk, 0, 0, cw, ch);
}
/* стрелка к тому, чего не видно на экране */
function edgeArrow(wx, wy, col, txt, inset) {
  var sx = (wx - cam.x) * scale + cw / 2, sy = (wy - cam.y) * scale + ch / 2;
  if (sx > 20 * dpr && sx < cw - 20 * dpr && sy > 20 * dpr && sy < ch - 20 * dpr) return;
  var mx = (64 + (inset || 0)) * dpr, mt = (118 + (inset || 0)) * dpr, mb = (176 + (inset || 0)) * dpr;
  var dx = sx - cw / 2, dy = sy - ch / 2, k = Math.min((cw / 2 - mx) / Math.abs(dx || 1), (ch / 2 - (dy < 0 ? mt : mb)) / Math.abs(dy || 1));
  var x = cw / 2 + dx * k, y = ch / 2 + dy * k, a = Math.atan2(dy, dx), r = 26 * dpr;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, r + 4 * dpr, 0, 6.29); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * (r + 20 * dpr), y + Math.sin(a) * (r + 20 * dpr)); ctx.lineTo(x + Math.cos(a + 0.6) * r, y + Math.sin(a + 0.6) * r); ctx.lineTo(x + Math.cos(a - 0.6) * r, y + Math.sin(a - 0.6) * r); ctx.closePath(); ctx.fill();
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.29); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = '800 ' + Math.round(24 * dpr) + 'px ui-rounded, system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(txt, x, y + 1 * dpr);
}
function drawHudCanvas() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  // где подруга, если она на другой карте
  var lines = [];
  var seek = game && game.g === 'hide' && game.it === store.id;
  players.forEach(function (p) { if (p !== me && p.m !== me.m && !seek) lines.push(p.name + (p.m === 2 ? ' в домике 🏠' : p.m === 1 ? ' в пещере 💎' : (p.y < 900 ? ' в тайной бухте 🏝' : ' на острове 🌳'))); });
  if (lines.length) {
    ctx.font = '800 ' + Math.round(17 * dpr) + 'px ui-rounded, system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    var tx = lines.join('   '), tw = ctx.measureText(tx).width + 28 * dpr, ty = ch - 104 * dpr;
    ctx.fillStyle = 'rgba(74,53,96,.85)'; rr(ctx, cw / 2 - tw / 2, ty - 17 * dpr, tw, 34 * dpr, 17 * dpr); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillText(tx, cw / 2, ty + 1);
  }
  if (me.m === 0) {
    // мини-карта
    var mw = 150 * dpr, mh = mw * 0.75, mx = 12 * dpr, my = 80 * dpr, k = mw / W;
    ctx.fillStyle = 'rgba(255,252,248,.9)'; rr(ctx, mx - 5 * dpr, my - 5 * dpr, mw + 10 * dpr, mh + 10 * dpr, 16 * dpr); ctx.fill();
    ctx.fillStyle = '#5fc8ea'; rr(ctx, mx, my, mw, mh, 12 * dpr); ctx.fill();
    ctx.drawImage(mini, mx, my, mw, mh);
    if (ev) { ctx.font = Math.round(16 * dpr) + 'px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('🌠', mx + ev.x * k, my + ev.y * k); }
    players.forEach(function (p) {
      if (p.m !== 0 || (seek && seen(p) < 1)) return;
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(mx + p.x * k, my + p.y * k, (p === me ? 6.5 : 5.5) * dpr, 0, 6.29); ctx.fill();
      ctx.fillStyle = lookOf(p.look).dress2; ctx.beginPath(); ctx.arc(mx + p.x * k, my + p.y * k, (p === me ? 4.5 : 3.8) * dpr, 0, 6.29); ctx.fill();
    });
    if (ev) edgeArrow(ev.x, ev.y, '#f5a623', '★', 62);
  }
  players.forEach(function (p) { if (p !== me && p.m === me.m && !seek) edgeArrow(p.x, p.y - 60, lookOf(p.look).dress2, (p.name || '?').charAt(0).toUpperCase()); });
  if (frozen()) { // ищущая считает с закрытыми глазами
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = 'rgba(40,24,70,.96)'; ctx.fillRect(0, 0, cw, ch);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '900 ' + Math.round(150 * dpr) + 'px ui-rounded, system-ui, sans-serif'; ctx.fillText(Math.max(1, Math.ceil(game.seekAt - T)), cw / 2, ch / 2);
    ctx.font = '800 ' + Math.round(30 * dpr) + 'px ui-rounded, system-ui, sans-serif'; ctx.fillText('🙈 Не подглядывай!', cw / 2, ch / 2 - 130 * dpr);
  }
  drawHatch();
  if (trans) { ctx.fillStyle = 'rgba(8,6,20,' + Math.min(1, trans.t < 0.35 ? trans.t / 0.3 : (0.7 - trans.t) / 0.3) + ')'; ctx.fillRect(0, 0, cw, ch); }
}

var lastT = 0, lobbyA = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  var dt = Math.min(0.05, (ts - lastT) / 1000 || 0); lastT = ts; T += dt;
  var inGame = screenMode === 'game' && me, curMap = inGame ? me.m : 0;
  if (inGame) { logic(dt); curMap = me.m; }
  else { lobbyA += dt * 0.1; cam.x = HOUSE.x + Math.cos(lobbyA) * 420; cam.y = HOUSE.y + 150 + Math.sin(lobbyA) * 240; }
  scale = curMap === 2 && cw > ch ? Math.min(cw / (HW - 30), ch / (HH - 30)) : scaleBase; // домик на планшете виден целиком
  var vw = cw / scale, vh = ch / scale, mw = [W, CW, HW][curMap], mh = [H, CH, HH][curMap], pad = [150, 60, 40][curMap];
  cam.x = vw >= mw + pad * 2 ? mw / 2 : Math.max(-pad + vw / 2, Math.min(mw + pad - vw / 2, cam.x));
  cam.y = vh >= mh + pad * 2 ? mh / 2 : Math.max(-pad + vh / 2, Math.min(mh + pad - vh / 2, cam.y));
  if (curMap === 2 && cw > ch) { cam.x = HW / 2; cam.y = HH / 2; }
  var x0 = cam.x - vw / 2, y0 = cam.y - vh / 2;
  if (curMap === 1) drawCave(dt, x0, y0, vw, vh); else if (curMap === 2) drawHouse(dt, x0, y0, vw, vh); else drawIsland(dt, x0, y0, vw, vh);
  drawParts(dt, curMap);
  if (curMap === 1) { drawDark(); ctx.setTransform(scale, 0, 0, scale, cw / 2 - cam.x * scale, ch / 2 - cam.y * scale); }
  drawLabels();
  if (inGame) drawHudCanvas();
}

buildSprites(); buildFurniture(); buildObjects(); buildCave(); buildMini();
requestAnimationFrame(frame);
</script>
